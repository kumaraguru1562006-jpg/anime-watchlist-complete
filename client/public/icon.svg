<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#070913" />

  <!-- Outer Glowing Gradient Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#bgGrad)" stroke-width="12" filter="url(#glow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#bgGrad)" stroke-width="6" />

  <!-- Inner Liquid Glass Plate -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#innerGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Anime Kanji / Brand Emblem Glow -->
  <circle cx="256" cy="256" r="130" fill="url(#bgGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Anime Play Shield Emblem -->
  <path d="M 210,160 L 360,256 L 210,352 Z" fill="url(#bgGrad)" filter="url(#glow)" />
  <path d="M 210,160 L 360,256 L 210,352 Z" fill="#ffffff" />

  <!-- Sparkle Accent -->
  <path d="M 370,140 Q 385,155 400,155 Q 385,155 370,170 Q 385,155 370,140 Z" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="150" cy="360" r="8" fill="#a855f7" filter="url(#glow)" />
</svg>
